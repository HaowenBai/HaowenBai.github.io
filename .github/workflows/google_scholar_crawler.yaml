name: Get Citation Data

# Fetches citation counts from Google Scholar every day (and after each site build), and
# pushes them as gs_data.json to the google-scholar-stats branch. The home page reads them from there.
# Run it by hand: GitHub repo -> Actions -> Get Citation Data -> Run workflow.
on:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write   # needed to push the google-scholar-stats branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip install -r requirements.txt
        python main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        # Google Scholar profile id (public; from the profile URL ...citations?user=<id>).
        # A repository secret named GOOGLE_SCHOLAR_ID overrides it.
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'gMSDelwAAAAJ' }}
