<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me"><span class="lang-en">Homepage</span><span class="lang-zh">主页</span></a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{% if link.title_zh %}<span class="lang-en">{{ link.title }}</span><span class="lang-zh">{{ link.title_zh }}</span>{% else %}{{ link.title }}{% endif %}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <div class="masthead__controls">
      <span class="masthead__btn switch" role="group" aria-label="语言 / Language"><button type="button" data-set-lang="zh" lang="zh-CN">中文</button><span class="switch__sep" aria-hidden="true">/</span><button type="button" data-set-lang="en" lang="en">EN</button></span>
      <span class="masthead__btn switch" role="group" aria-label="浅色 / 深色 (light / dark)"><button type="button" data-set-theme="light" title="浅色 / Light" aria-label="浅色 / Light"><i class="fas fa-sun" aria-hidden="true"></i></button><span class="switch__sep" aria-hidden="true">/</span><button type="button" data-set-theme="dark" title="深色 / Dark" aria-label="深色 / Dark"><i class="fas fa-moon" aria-hidden="true"></i></button></span>
    </div>
  </div>
</div>
